[project]
name = "apodify"
version = "0.1.0"
description = "Enhance APOD entries by adding extra properties for better organization and filtering"
readme = "README.md"
authors = [
    { name = "paulinek13" }
]
requires-python = ">=3.12"
dependencies = [
    "dotenv>=0.9.9",
    "loguru>=0.7.3",
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.6.14",
    "mkdocstrings[python]>=0.29.1",
    "pillow>=11.2.1",
    "pytest>=8.3.5",
    "requests>=2.32.3",
    "rich>=14.0.0",
]

[project.scripts]
apodify = "apodify:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
